<!DOCTYPE html>
<html lang="ja">
<head>
  <title>${title}</title>
  <meta name="keywords" content="${keywords}よさこい, 鳴子踊り, ソーラン, 阿波踊り, 祭り, japanese festival, japanese dance, 日本舞踊, 高知, 写真">
  <meta name="description" content="${jpDescription}" lang="ja">
  <meta name="description" content="${enDescription}" lang="en">
  <meta name="author" content="Cerberus">
  <meta name="robots" content="index, follow">
  <meta http-equiv="content-language" content="ja">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="${title}">
  <meta property="og:type" content="website">
  <meta property="og:image" content="${coverImage}">
  <meta property="og:url" content="${canonical}">
  <meta property="og:site_name" content="よさこい写真">
  <meta property="og:description" content="${jpDescription}">

  <!-- will be helpful after creating cache for each page -->
  <link rel="canonical" href="${canonical}">

  <!-- Structured data for better SEO -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BlogPosting",
      "headline": "${title}",
      "image": [
        "${coverImage}"
      ],
      "datePublished": "${publishedDate}",
      "dateModified": "${modifiedDate}",
      "author": [{
        "@type": "Person",
        "name": "Cerberus",
        "url": "https://www.instagram.com/cerberusrei.yosakoi"
      }]
    }
  </script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">

  <style>
    body {
      background-image: linear-gradient(to bottom, #dcdcdc, #dcdcdc);
      background-color: rgba(255, 255, 255, 0.9);
    }

    .header {
      background-color: rgba(200, 200, 200, 0.5);
      z-index: 1000;
      width: 100%;
    }

    #photoFrame .modal-content {
      background-color: transparent;
    }

    #photoFrame .modal-body {
      padding: 0; /* Allow image to be fix with device window */
    }

    #photoFrame .modal-body .container {
      padding: 0; /* Allow image to be fix with device window */
    }

    #photoFrame .gallery-photo-modal-body {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
    }

    #photoFrame .gallery-photo-actions {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, 0.5) 35%, rgba(0, 0, 0, 0.75) 100%);
      pointer-events: none;
      z-index: 5;
    }

    #photoFrame .gallery-photo-actions .download-link,
    #photoFrame .gallery-photo-actions .btn {
      pointer-events: auto;
    }

    .gallery-tile-download {
      position: absolute;
      bottom: 5px;
      right: 5px;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.88);
      color: #212529;
      opacity: 0.9;
      text-decoration: none;
      font-size: 1rem;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    }

    .gallery-tile-download:hover {
      opacity: 1;
      color: #000;
    }

    /* customize for popover info content */
    .custom-popover {
      min-width: 400px;
      --bs-popover-max-width: 100%;
      --bs-popover-border-color: var(--bs-primary);
      --bs-popover-header-bg: var(--bs-primary);
      --bs-popover-header-color: var(--bs-white);
      --bs-popover-body-padding-x: 1rem;
      --bs-popover-body-padding-y: .5rem;
    }

    /* Default style for non-image items */
    .default-thumbnail {
      height: 124px;
    }

    .breadcrumb-item:not(.active) {
      font-weight: bolder;
    }

    .modal-content-image {
      max-width: 100%;
      max-height: 100vh;
      margin: auto;
    }

    .source-image-spinner {
      position: absolute;
      text-align: center;
      top: 50%;
      left: 50%;
    }

    .transparent-button {
      opacity: 0.5;
      filter: alpha(opacity=50);
    }

    #albumListFrame a {
      color: grey;
      font-family: "Comic Sans MS";
      text-decoration: none;
    }

    #albumListFrame .card:hover {
      border-color: burlywood;
      border-width: 5px;
    }

    #albumListFrame .modal-dialog {
      display: table; /* To make the content in center */
    }

    #albumListFrame .modal-body {
      height: 512px;
      overflow-y: scroll;
    }

    .organized-album {
      background-color: #e9ecef;
    }

    .album-filter-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #gallery-app {
      max-width: 100%;
    }

    .gallery-page {
      max-width: 960px;
      margin-left: auto;
      margin-right: auto;
      padding: 0 2px 48px;
    }

    .gallery-page--single {
      max-width: 100%;
      padding-left: 4px;
      padding-right: 4px;
    }

    .gallery-page--single .gallery-grid {
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .gallery-page--single .gallery-tile {
      aspect-ratio: auto;
      min-height: 0;
      overflow: visible;
      background: #111;
    }

    .gallery-page--single .gallery-tile-media {
      width: 100%;
      height: auto;
      max-height: min(92vh, 2200px);
      object-fit: contain;
      object-position: center top;
      display: block;
      margin: 0 auto;
    }

    .gallery-page--single .gallery-tile-video-placeholder {
      width: 100%;
      height: auto;
      min-height: 36vh;
      aspect-ratio: auto;
    }

    .gallery-header-bar {
      min-width: 0;
    }

    .gallery-layout-toggle {
      width: 40px;
      height: 34px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(0, 0, 0, 0.08);
    }

    .gallery-layout-picto {
      display: inline-flex;
      align-items: flex-end;
      gap: 5px;
      height: 16px;
    }

    .gallery-layout-picto .glp-one {
      display: block;
      width: 6px;
      height: 12px;
      background: #adb5bd;
      border-radius: 2px;
      transition: height 0.15s ease, background 0.15s ease, opacity 0.15s ease;
    }

    .gallery-layout-picto .glp-three {
      display: inline-flex;
      align-items: stretch;
      gap: 2px;
      height: 14px;
    }

    .gallery-layout-picto .glp-three i {
      display: block;
      width: 3px;
      align-self: stretch;
      background: #adb5bd;
      border-radius: 2px;
      transition: background 0.15s ease, opacity 0.15s ease;
    }

    .gallery-layout-picto[data-mode="single"] .glp-one {
      height: 16px;
      background: #0d6efd;
    }

    .gallery-layout-picto[data-mode="single"] .glp-three i {
      opacity: 0.45;
      background: #adb5bd;
    }

    .gallery-layout-picto[data-mode="triple"] .glp-three i {
      background: #0d6efd;
    }

    .gallery-layout-picto[data-mode="triple"] .glp-one {
      height: 10px;
      opacity: 0.45;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      width: 100%;
    }

    @media (min-width: 768px) {
      .gallery-page:not(.gallery-page--single) .gallery-grid {
        gap: 3px;
      }
    }

    .gallery-tile {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 1;
      padding: 0;
      border: none;
      overflow: hidden;
      background: #1a1a1a;
      cursor: pointer;
    }

    .gallery-tile:focus-visible {
      outline: 2px solid #0d6efd;
      outline-offset: 2px;
    }

    .gallery-tile-media {
      width: 100%;
      height: 100%;
      object-fit: cover;
      vertical-align: middle;
    }

    .tile-folder--unorganized {
      box-shadow: inset 0 0 0 3px #e9ecef;
    }

    .gallery-tile-caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 4px 6px;
      font-size: 0.65rem;
      line-height: 1.2;
      color: #fff;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.75));
      text-align: left;
      max-height: 40%;
      overflow: hidden;
    }

    .gallery-tile-badge-wrap {
      position: absolute;
      top: 4px;
      left: 4px;
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
      max-width: calc(100% - 8px);
    }

    .gallery-cat-badge {
      font-size: 0.55rem;
      padding: 2px 4px;
      border-radius: 3px;
      color: #fff;
      opacity: 0.85;
    }

    .gallery-tile-video-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2c2c2c;
      color: #adb5bd;
      font-size: 2rem;
    }

    .gallery-yt-icon {
      font-size: 2.5rem;
      color: #ff0000;
    }

    .gallery-tile-lock {
      position: absolute;
      bottom: 6px;
      right: 6px;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.85);
      color: #333;
    }

    .gallery-loading {
      display: flex;
      justify-content: center;
      padding: 16px;
    }

    .gallery-fetch-overlay {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1040;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 0px));
      pointer-events: none;
      background: linear-gradient(0deg, rgba(0, 0, 0, 0.5) 0%, transparent 100%);
    }

    .gallery-fetch-overlay-inner {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 10px 20px;
      border-radius: 999px;
      background: rgba(25, 25, 25, 0.92);
      color: #fff;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
      animation: gallery-fetch-pop 0.35s ease-out;
    }

    @keyframes gallery-fetch-pop {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .gallery-fetch-spinners {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .gallery-fetch-pulse {
      animation: gallery-fetch-breathe 0.9s ease-in-out infinite;
    }

    @keyframes gallery-fetch-breathe {
      0%, 100% { opacity: 0.35; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    .gallery-fetch-text {
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .gallery-progress-chip {
      position: fixed;
      left: 50%;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      z-index: 1030;
      max-width: min(420px, 94vw);
      padding: 8px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.12);
      text-align: center;
      line-height: 1.35;
      border: 1px solid rgba(255, 255, 255, 0.6);
      transition: bottom 0.25s ease;
    }

    .gallery-progress-chip--with-loader {
      bottom: calc(88px + env(safe-area-inset-bottom, 0px));
    }

    .gallery-progress-chip--more {
      border-color: rgba(13, 110, 253, 0.35);
    }

    .gallery-progress-chip-count {
      display: block;
      font-weight: 600;
      font-size: 0.95rem;
      color: #212529;
    }

    .gallery-progress-chip-hint {
      display: block;
      font-size: 0.75rem;
      color: #495057;
      margin-top: 2px;
    }

    .gallery-progress-chip--single .gallery-progress-chip-count {
      font-weight: 500;
      font-size: 0.85rem;
    }

    .gallery-tile-play {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.22);
    }

    .gallery-tile-play i {
      font-size: 2.25rem;
      color: #fff;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6));
      line-height: 1;
    }

    .gallery-toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1060;
      padding: 10px 16px;
      background: rgba(33, 37, 41, 0.92);
      color: #fff;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .gallery-breadcrumb .breadcrumb {
      background: transparent;
      padding: 4px 0;
    }

    .breadcrumb-label {
      max-width: min(280px, 40vw);
    }

    .breadcrumb-btn--current {
      pointer-events: none;
      opacity: 0.9;
    }

    .share-icon {
      cursor: pointer;
      color: #495057;
    }

    .gallery-photo-modal {
      background-color: transparent;
    }

    .gallery-photo-actions .btn {
      pointer-events: auto;
    }

  </style>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QFKJ9BT7LX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-QFKJ9BT7LX');
  </script>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

  <script src="/js/google-analytics-util.js"></script>
  <script src="/js/albums.js?t=1778176497918"></script>
  <script type="importmap">
    {
      "imports": {
        "vue": "https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.esm-browser.prod.js"
      }
    }
  </script>
  <script type="module" src="/js/gallery-app.js?t=20260512e"></script>

  <script type="text/javascript">
    window.onerror = function(error) {
      alert("window error..." + error + "\n" + error.stack);
    }
  </script>
</head>
<body>
<div class="container position-fixed header" style="max-width: 100%; top: 0">
  <div class="row align-items-center g-0 w-100">
    <div class="dropdown col-auto" style="margin: 5px">
      <button class="btn btn-secondary"
              data-bs-toggle="modal" data-bs-target="#albumListFrame">
        <i class="bi bi-journal-album"></i>
      </button>
      <button class="btn btn-primary"
              data-bs-toggle="modal" data-bs-target="#infoFrame">
        <i class="bi bi-info-square"></i>
      </button>
      <a href="https://cerberusrei.clear-net.jp/public/events-view.html"
         target="_blank"
         rel="noopener noreferrer"
         class="btn btn-success">
        <i class="bi bi-calendar-event"></i>
      </a>
    </div>
    <div class="col min-w-0" id="breadcrumb-mount"></div>
  </div>
</div>

<div class="container text-center px-0" style="max-width: 100%">
  <div id="gallery-app"></div>
</div>

<!-- Album List Modal -->
<div class="modal modal-dialog-scrollable fade" id="albumListFrame"
     tabindex="-1" aria-labelledby="albumListFrameLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Album List</h5>
        <div class="album-filter-container">
          <select name="year" class="form-control">
            <option value=""> - </option>
          </select>
          <select name="month" class="form-control">
            <option value=""> - </option>
          </select>
        </div>
      </div>
      <div class="modal-body">
        <div class="container">
          <div class="row">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- Info Modal -->
<div class="modal modal-dialog-scrollable fade" id="infoFrame"
     tabindex="-1" aria-labelledby="infoFrameLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Info</h5>
      </div>
      <div class="modal-body">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<div class="position-fixed top-50 start-50 translate-middle toast-container"
     style="z-index: 1050; width: auto; max-width: 100%;"></div>

<!-- scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-OERcA2EqjJCMA+/3y+gxIOqMEjwtxJY7qPCqsdltbNJuaOe923+mo//f6V8Qbsw3"
        crossorigin="anonymous"></script>
</body>
</html>
